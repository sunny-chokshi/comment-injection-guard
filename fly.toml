# Fly.io config. Set the app name, then: fly launch --no-deploy; fly secrets set ...; fly deploy
app = "comment-injection-guard"
primary_region = "iad"

[build]

[env]
  GUARD_DETECTOR = "either"
  GUARD_MODE = "strip_all"
  REVIEWER_BACKEND = "none"
  RATE_PER_MIN = "30"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
